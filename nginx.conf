# Cache for the Roblox presence proxy below (included inside http{}, so this must sit outside server{}). 1 MB is plenty:
# there is exactly one cache key (the one user's presence document).
proxy_cache_path /var/cache/nginx/roblox levels=1 keys_zone=roblox:1m max_size=1m inactive=10m use_temp_path=off;

# One Cache-Control per response class, set at server level only: an add_header inside a location would
# silently drop every inherited add_header (nginx inheritance rule), including the security headers.
map $uri $mrh_cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";  # Vite fingerprints everything in /assets/
    ~\.html$     "no-cache";                             # index.html, 404.html: always revalidate
    /            "no-cache";
    /healthz     "no-store";
    # Squad 3D avatars (src/squad, public/roblox/squad/<id>/[phone/]). Fingerprinted .bin/textures/posters never change
    # under the same name; avatar.json (the manifest that names them) must revalidate so an avatar refresh goes live.
    "~^/roblox/squad/.+/avatar.json$" "no-cache";
    "~^/roblox/squad/.+.[0-9a-f]{8}.(bin|webp|avif|png)$" "public, max-age=31536000, immutable";
    /api/roblox-presence "no-store";   # live status: the browser must not reuse it (nginx caches it for 45 s, see below)
    default      "public, max-age=86400";                # og.png, icons, manifest, avatar, screenshots
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # TLS terminates at Coolify's proxy; absolute redirects would point clients at http:// (the sibling site does
    # exactly that on /quests → http://…/quests/).
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types application/octet-stream text/plain text/css text/xml application/xml application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    add_header Cache-Control $mrh_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Only features Chrome recognises: an unknown token (e.g. interest-cohort) logs a console error → Lighthouse BP < 100.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Roblox presence for the Roblox card and the Contact tile. presence.roblox.com sends no CORS headers, so the browser
    # cannot call it directly; this location is a same-origin, single-purpose proxy, not a general one:
    #  - GET only, and nothing from the client is forwarded (no headers, no cookies, no body, no query string);
    #  - the upstream request is a fixed POST for one user id. KEEP IN SYNC BY HAND with site.roblox.userId in
    #    src/config/site.ts (vite.config.ts reads that one for dev/preview);
    #  - one cached document, so Roblox sees at most ~1 request per 45 s however many visitors there are.
    # No add_header in here, on purpose: any add_header in a location silently drops every add_header inherited from the
    # server block (security headers, Cache-Control). The map above already yields `no-store` for this URI.
    location = /api/roblox-presence {
        limit_except GET { deny all; }

        # A variable in proxy_pass makes nginx resolve the name at request time, so nginx still starts when DNS is down at
        # boot (a literal hostname would abort the whole container). Docker's embedded DNS first, 1.1.1.1 as a backstop.
        resolver 127.0.0.11 1.1.1.1 ipv6=off valid=30s;
        resolver_timeout 2s;
        set $roblox_presence_url https://presence.roblox.com/v1/presence/users;
        set $args "";                              # a variable proxy_pass would otherwise append the client's query
        proxy_pass $roblox_presence_url;
        proxy_ssl_server_name on;                  # SNI, or Roblox's CDN answers with the wrong certificate

        proxy_method POST;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host presence.roblox.com;
        proxy_set_header Content-Type application/json;
        proxy_set_header Accept application/json;
        proxy_set_body '{"userIds":[1113999731]}';

        proxy_cache roblox;
        proxy_cache_key roblox-presence;
        proxy_cache_valid 200 45s;
        proxy_cache_valid any 10s;
        proxy_cache_lock on;                       # a burst after expiry makes one upstream call, not N
        proxy_cache_background_update on;          # serve the stale copy while one request refreshes it
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;

        # Roblox's own caching and cookie headers must not decide anything here (cookies would also stop caching).
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        # Roblox's edge headers must not become ours: Strict-Transport-Security, Report-To and NEL would configure mrh.lol
        # itself (HSTS for an hour, network-error reports sent to Roblox). Exact names only: nginx has no wildcard here.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Report-To;
        proxy_hide_header NEL;
        proxy_hide_header X-Ratelimit-Limit;
        proxy_hide_header X-Ratelimit-Remaining;
        proxy_hide_header X-Ratelimit-Reset;
        proxy_hide_header X-Envoy-Upstream-Service-Time;
        proxy_hide_header X-Envoy-Attempt-Count;
        proxy_hide_header X-Ingress-Proxy;
        proxy_hide_header X-Roblox-Edge;
        proxy_hide_header Roblox-Machine-Id;
        proxy_hide_header X-Terms-Message;
        # Our server-level add_header set already carries these; hiding avoids duplicated values.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        proxy_connect_timeout 3s;
        proxy_send_timeout 3s;
        proxy_read_timeout 4s;
    }

    location = /site.webmanifest { default_type application/manifest+json; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
